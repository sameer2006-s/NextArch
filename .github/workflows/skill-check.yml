name: Skill check

on:
  push:
    branches: [master, main]
    paths:
      - "skills/**"
      - "scripts/**"
      - ".github/**"
      - "package.json"
      - "CHANGELOG.md"
  pull_request:
    branches: [master, main]
    paths:
      - "skills/**"
      - "scripts/**"
      - ".github/**"
      - "package.json"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: skill-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skill-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deterministic skill checks
        run: npm run skill:check

      - name: Skills CLI lists nextarch
        run: |
          npx --yes skills add . --list 2>&1 | tee skills-list.txt
          grep -qi nextarch skills-list.txt
