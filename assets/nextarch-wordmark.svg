  <title>NextArch</title>
  <style>
    .next { fill: #1f2328; }
    .arch { fill: #0070f3; }
    @media (prefers-color-scheme: dark) {
      .next { fill: #f0f6fc; }
    }
  </style>
  <text
    x="160"
    y="62"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="40"
    font-weight="700"
  >
    <tspan class="next" fill="#1f2328">Next</tspan><tspan class="arch" fill="#0070f3">Arch</tspan>
